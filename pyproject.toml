[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image2editable"
version = "0.1.0"
description = "Local-first image to editable PPTX and layered PSD runtime"
readme = "README_EN.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.scripts]
image2editable = "image2editable.cli:main"

[project.optional-dependencies]
agent-local = [
    "huggingface-hub>=0.34.0",
    "torch>=2.5.0",
    "transformers>=4.57.0",
    "accelerate>=1.8.0",
]
psd = ["aspose-psd>=26.5.0"]
render-qa = ["pywin32>=306; sys_platform == 'win32'"]
test = [
    "pytest",
    "pypdf>=5",
    "reportlab>=4",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
py-modules = ["image_to_ppt", "image_to_psd"]

[tool.setuptools.packages.find]
include = ["image2editable*", "scripts*"]

[tool.setuptools.package-data]
image2editable = ["model_catalog.json"]

[tool.pytest.ini_options]
markers = [
    "powerpoint: requires Windows and an installed Microsoft PowerPoint",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
