[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image2editable"
version = "0.3.0"
description = "Image to editable PPTX and layered PSD runtime"
readme = "README_EN.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "python-pptx>=1.0.2,<2",
    "opencv-python>=4.10.0.84,<5",
    "Pillow>=10.4,<12",
    "numpy>=1.26.4,<2",
    "pypdfium2>=5.7.1,<6",
    "pypdf>=5,<7",
    "psutil>=7,<8",
    "torch>=2.5.1,<3",
    "torchvision>=0.20.1,<1",
    "sam2>=1.1.0,<2",
    "transformers>=4.57,<5",
    "accelerate>=1.8,<2",
]

[project.scripts]
image2editable = "image2editable.cli:main"

[project.optional-dependencies]
psd = ["aspose-psd>=26.5.0"]
render-qa = ["pywin32>=306; sys_platform == 'win32'"]
test = [
    "pytest",
    "PyYAML>=6,<7",
    "pypdf>=5",
    "reportlab>=4",
    "fonttools>=4.50,<5",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
py-modules = ["image_to_ppt", "image_to_psd"]

[tool.setuptools.packages.find]
include = ["image2editable*", "scripts*"]

[tool.setuptools.package-data]
image2editable = ["runtime_model_catalog.json"]

[tool.pytest.ini_options]
markers = [
    "powerpoint: requires Windows and an installed Microsoft PowerPoint",
]
