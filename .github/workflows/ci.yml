name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  fast-model-free:
    name: Fast model-free / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install model-free test dependencies
        run: python -m pip install --constraint constraints/runtime.txt pytest PyYAML pypdf reportlab python-pptx opencv-python-headless Pillow numpy pypdfium2 torch
      - name: Run model-free tests
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest "${{ github.workspace }}/tests" --import-mode=importlib -m "not powerpoint" -q

  build-distribution:
    name: Build distribution / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install distribution tools
        run: python -m pip install build twine
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error

  installed-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / installed wheel
    needs: build-distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: distribution
          path: ${{ runner.temp }}/distribution
      - name: Locate the built wheel
        shell: python
        run: |
          from pathlib import Path
          import os
          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "distribution").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              print(f"WHEEL_PATH={wheels[0]}", file=env_file)
      - name: Bootstrap pinned build runtime
        run: python -m pip install --constraint constraints/runtime.txt --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision setuptools==84.0.0
      - name: Install built wheel
        run: python -m pip install --constraint constraints/runtime.txt --no-build-isolation --no-binary antlr4-python3-runtime "${{ env.WHEEL_PATH }}[test]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: installed_package_smoke
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/installed_package_smoke.py" --checkout-root "${{ github.workspace }}"
      - name: Run tests against installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests" --import-mode=importlib -m "not powerpoint" -q
