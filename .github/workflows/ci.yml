name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install model-free test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pypdf reportlab python-pptx "opencv-python-headless>=4.5.0,<5" Pillow numpy "pypdfium2>=5.7.1,<6" tomli
      - name: Run tests without Microsoft PowerPoint
        run: python -m pytest -m "not powerpoint" -q
