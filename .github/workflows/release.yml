name: Draft v0.2.0 release

on:
  push:
    tags:
      - v0.2.0

permissions:
  actions: read
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Download same-commit release-gate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow release-gate.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" --name distribution --dir "$RUNNER_TEMP/distribution"
          gh run download "$run_id" --name core-v0.2-benchmark-report --dir "$RUNNER_TEMP/core-report"
      - name: Validate tag, distribution, citation, and benchmark
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}
        shell: python
        run: |
          import email
          import json
          import os
          from pathlib import Path
          import re
          from zipfile import ZipFile

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if os.environ["GITHUB_REF_NAME"] != "v0.2.0":
              raise SystemExit("unexpected tag")
          root = Path(os.environ["ARTIFACT_ROOT"])
          wheels = list((root / "distribution").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one wheel")
          with ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              package = email.message_from_bytes(archive.read(metadata_name))
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version: ([^\s]+)$", citation)
          if package["Version"] != expected or match is None or match.group(1) != expected:
              raise SystemExit("release versions differ")
          report = json.loads((root / "core-report" / "report.json").read_text(encoding="utf-8"))
          if report["status"] != "passed":
              raise SystemExit("core benchmark did not pass")
          if report["totals"] != {"cases": 10, "failed_attempts": 0, "pages": 42}:
              raise SystemExit("unexpected core benchmark totals")
          if report["repeat"] != 3:
              raise SystemExit("unexpected core benchmark repeat")
      - name: Create checksums
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_ROOT"])
          artifacts = sorted((root / "distribution").iterdir())
          artifacts.append(root / "core-report" / "report.json")
          lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in artifacts]
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP"/distribution/*
          "$RUNNER_TEMP"/core-report/report.json
          "$RUNNER_TEMP/SHA256SUMS"
          --draft
          --verify-tag
          --latest=false
          --title "image2editable v0.2.0"
          --notes-file RELEASE_NOTES_v0.2.0.md
